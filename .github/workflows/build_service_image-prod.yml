name: build_service_image-prod
on:
  workflow_dispatch:
  push:
    tags:
      - '*'
jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Image with Codabench Version as tag
        run: docker buildx build --platform linux/amd64,linux/arm64 --push -t codalab/codabench-service:${{ github.ref_name }} -f packaging/container/Containerfile .
      - name: Build and push Image with latest as tag
        run: docker buildx build --platform linux/amd64,linux/arm64 --push -t codalab/codabench-service:latest -f packaging/container/Containerfile .