{% extends "profiles/settings_base.html" %}

{% block title %}Change Password - Codabench{% endblock %}

{% block settings_title %}Change Password{% endblock %}

{% block settings_content %}
    <!-- Same box as the info announcements on the home page -->
    <div class="announcement announcement-info settings-notice">
        <div class="announcement-content">
            <div class="announcement-body">We'll email you a secure link to change your password.</div>
        </div>
    </div>
    <a class="settings-button" href="{% url 'accounts:password_reset' %}">Change password</a>
{% endblock %}
