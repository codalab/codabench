name: build_CW_docker_image_master
on:
  workflow_dispatch:
  push:
    tags:
      - '*'
    paths:
      - packaging/container/Containerfile.compute_worker
      - compute_worker/**
jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Image with Codabench Version as tag
        run: docker buildx build --platform linux/amd64,linux/arm64 --push -t codalab/codabench-compute-worker:${{ github.ref_name }} -f packaging/container/Containerfile.compute_worker .
      - name: Build and push Image with latest as tag
        run: docker buildx build --platform linux/amd64,linux/arm64 --push -t codalab/codabench-compute-worker:latest -f packaging/container/Containerfile.compute_worker .
      - name: Build and push image with prod release tag + date for CVEs versioning
        run: |
          NOW=$(date "+%Y-%m-%dT%H-%M-%S")
          docker buildx build --platform linux/amd64,linux/arm64 --push -t codalab/codabench-compute-worker:${{ github.ref_name }}-${NOW} -f packaging/container/Containerfile.compute_worker .