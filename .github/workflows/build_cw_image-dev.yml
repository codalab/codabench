name: build_CW_docker_image_develop
on:
  push:
    branches:
      - develop
    paths:
      - packaging/container/Containerfile.compute_worker
      - compute_worker/**
jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build Image
        run: docker buildx build --platform linux/amd64,linux/arm64 --push -t codalab/codabench-compute-worker:test -f packaging/container/Containerfile.compute_worker .
