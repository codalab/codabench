[project]
name = "codabench"
version = "0.1.0"
description = ""
authors = [{ name = "Codalab" }]
requires-python = "==3.13.11"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "django==5.2.17",
    "django-oauth-toolkit==3.4.1",
    "social-auth-core==5.1.0",
    "social-auth-app-django==6.0.1",
    "django-extensions==4.1.0",
    "channels==4.3.2",
    "channels-redis==4.3.0",
    "pillow==12.3.0",
    "celery==5.6.3",
    "gunicorn==26.2.0",
    "urllib3==2.7.0",
    "uvicorn==0.52.4",
    "pyyaml==6.0.3",
    "watchdog==6.0.0",
    "argh==0.31.3",
    "python-dateutil==2.9.0",
    "bpython==0.26",
    "websockets==17.1",
    "aiofiles==25.1.0",
    "oyaml==1.0",
    "factory-boy==3.3.3",
    "blessings==1.7",
    "django-su>=1.0.0,<2",
    "django-ajax-selects==3.0.3",
    "dj-database-url==0.4.2",
    "psycopg2-binary>=2.9.9,<3",
    "django-redis==7.0.0",
    "django-storages[azure]>=1.14.6,<2",
    "azure-storage-blob>=12,<13",
    "azure-storage-common==2.1.0",
    "boto3==1.43.92",
    "whitenoise==6.12.0",
    "djangorestframework==3.18.1",
    "djangorestframework-csv==3.0.1",
    "drf-extensions==0.8.0",
    "markdown==3.10.3",
    "pygments==2.21",
    "drf-writable-nested==0.7.2",
    "flex==6.14.1",
    "pyrabbit2==1.0.7",
    "django-enforce-host==1.1.0",
    "twisted==26.4.0",
    "ipdb==0.13.13",
    "jinja2==3.1.6",
    "requests==2.34.2",
    "drf-extra-fields==3.7.0",
    "drf-spectacular>=0.28.0,<0.29",
    "loguru>=0.7.3,<0.8",
    "tzdata>=2025.3",
    "setuptools==84.0",
    "pytz==2026.3.post1",
    "django-filter==25.1",
    "django-cors-headers==4.9.0",
    "nh3==0.3.3",
    "configobj==5.0.9",
    "redis-cli>=1.0.1",
    "uvicorn-worker>=0.4.0",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django-querycount==0.7.0",
    "django-debug-toolbar==6.2.0",
    "flake8==7.3.0",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "settings.develop"  # Just "settings" since pytest will be running from src/
pythonpath = [".", "src", "src/apps"]
testpaths = ["src"]  # Tell pytest to look for tests in src/
addopts = "-v --tb=short --reuse-db"

