name: build_CW_docker_image_branch
on:
  push:
    # On push for every branch except develop and master since they have their own workflows
    branches:
      - '*'
      - '!develop'
      - '!master'
    paths:
      - packaging/container/Containerfile.compute_worker
      - compute_worker/**
jobs:
  build_push_image:
    name: Build Docker Image then Push it to Docker.io
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build Image
        run: docker buildx build --platform linux/amd64,linux/arm64 --push -t codalab/codabench-compute-worker:${{ github.ref_name }} -f packaging/container/Containerfile.compute_worker .