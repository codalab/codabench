istio:
  enableVirtualService: false 

ingress:
  spec:
    ingressClassName: <ingress-class>              # e.g. nginx or traefik
    rules:
    - http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: django
              port:
                number: 8000

django:
  image:
    repository: <django-image-repository>
    pullPolicy: Always
    tag: <django-image-tag>
  replicas: 1
  port: 8000
  workingDir: /app/src

flower:
  image:
    repository: mher/flower
    tag: latest
    pullPolicy: Always
  replicas: 1
  service:
    port: 5555

compute_worker:
  image:
    repository: <compute-worker-image-repository>
    tag: <compute-worker-image-tag>
    pullPolicy: Always
  container_engine_executable: "kubernetes"
  kubernetesVerifySsl: "false"
  podCreationRetries:
    totalTimeToWaitForPod: 300
    sleepTimeBetweenRetries: 0.5
  submissionPods:
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    metadata:
      labels: {}
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 512Mi
  volumes:
    pvcName: shared-job-pvc
  codalabIgnoreCleanupStep: "0"
  brokers:
    - name: "default"
      gpu:
        enabled: false

siteWorker:
  image:
    repository: <django-image-repository>
    tag: <django-image-tag>
    pullPolicy: Always
  replicas: 1
  workingDir: /app/src
  concurrency: 2
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 0
  volumes:
    pvcName: app-state

redis:
  image:
    pullPolicy: Always
  enabled: true
  auth:
    enabled: false
  architecture: standalone
  master:
    persistence:
      enabled: false
      storageClass: <storage-class>
      size: 1Gi 
    service:
      ports:
        redis: 6379

rabbitmq:
  image:
    pullPolicy: Always
  auth:
    username: rabbit-username
    password: rabbit-password-you-should-change
  service:
    ports:
      amqp: 5672
  persistence:
    enabled: true
    storageClass: <storage-class>
    size: 1Gi 
  extraEnvVars:
    - name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
      value: "-rabbit consumer_timeout 100000000"

global:
  defaultStorageClass: <storage-class>

sharedJob:
  storageClass: <storage-class>
  pvcName: shared-job-pvc
  storage: 1Gi

appState:
  storageClass: <storage-class>
  pvcName: app-state-pvc
  storage: 1Gi

db:
  host: <database-host>
  name: <database-name>
  username: <database-username>
  password: <database-password>
  port: <database-port>

env:
  LOG_LEVEL: "info"
  
  SECRET_KEY: <your-django-secret-key>

  DJANGO_SETTINGS_MODULE: settings.develop
  SUBMISSIONS_API_URL: http://django:8000/api
  MAX_EXECUTION_TIME_LIMIT: "600"

  DOMAIN_NAME: <domain-name>

  TLS_EMAIL: <your@email.com>

  RABBITMQ_HOST: <rabbitmq-hostname>
  RABBITMQ_DEFAULT_USER: <rabbit-username>
  RABBITMQ_DEFAULT_PASS: <rabbit-password>
  RABBITMQ_MANAGEMENT_PORT: "15672"
  RABBITMQ_PORT: "5672"

  FLOWER_PUBLIC_PORT: "5555"
  FLOWER_BASIC_AUTH: <user:password>

  SELENIUM_HOSTNAME: <selenium-hostname>

  RERUN_SUBMISSION_LIMIT: "30"

  ENABLE_SIGN_UP: "True"
  ENABLE_SIGN_IN: "True"

  STORAGE_TYPE: s3
  AWS_ACCESS_KEY_ID: <aws-access-key>
  AWS_SECRET_ACCESS_KEY: <aws-secret-key>
  AWS_STORAGE_BUCKET_NAME: <aws-bucket-name>
  AWS_STORAGE_PRIVATE_BUCKET_NAME: <aws-private-bucket-name>
  AWS_S3_ENDPOINT_URL: <s3-endpoint-url>
  AWS_QUERYSTRING_AUTH: "False"

  REDIS_URL: redis://<redis-host>:6379
